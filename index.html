<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sip — Wine Cellar &amp; Tasting Journal</title>
  <meta name="description" content="Sip is a personal wine cellar and tasting journal for iPhone.">
  <link rel="icon" href="images/app-icon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <style>
    :root { --ground:#14110e; --surface:#1d1813; --ink:#f3ece1; --faint:#a99c87; --gold:#c8a96a; --hairline:#352c22; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background: var(--ground); color: var(--ink);
      font-family: ui-serif, "New York", Georgia, serif;
      display: flex; align-items: center; justify-content: center; text-align: center;
      padding: 24px; -webkit-font-smoothing: antialiased;
    }
    main { max-width: 32rem; }
    img.icon {
      width: 116px; height: 116px; border-radius: 26px; margin: 0 0 1.5rem;
      box-shadow: 0 10px 34px rgba(0,0,0,.55); border: 1px solid var(--hairline);
    }
    h1 { font-size: 3.5rem; font-weight: 600; margin: 0 0 .25rem; letter-spacing: -0.01em; }
    p.tagline { color: var(--faint); font-size: 1.15rem; margin: 0 0 2rem; }
    a.button {
      display: inline-block; text-decoration: none;
      background: var(--gold); color: #1a140c; font-weight: 600;
      padding: 0.85rem 1.6rem; border-radius: 999px; font-size: 1.05rem;
    }
    footer { margin-top: 2.5rem; color: var(--faint); font-size: 0.9rem; }
    footer a { color: var(--faint); }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="images/app-icon.png" alt="Sip app icon" width="116" height="116">
    <h1>Sip</h1>
    <p class="tagline">Your personal wine cellar and tasting journal.</p>
    <a class="button" href="https://apps.apple.com/app/id6444360091">Download on the App&nbsp;Store</a>
    <footer>
      <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a>
    </footer>
  </main>
</body>
</html>
